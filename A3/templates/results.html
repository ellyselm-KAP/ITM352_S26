<!DOCTYPE html>
<html>
<head>
    <title>Quiz Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container d-flex justify-content-center mt-5">
    <div class="quiz-card text-center w-100" style="max-width: 600px;">

        <h1 class="mb-3">🎉 Quiz Complete</h1>

        <h4 class="mb-3">Your score: <span class="text-primary">{{ score }}</span> / {{ total }}</h4>
        <p><strong>Correct answers:</strong> {{ correct_count }}</p>
        <p><strong>Incorrect answers:</strong> {{ incorrect_count }}</p>
        <p><strong>Time taken:</strong> {{ time_taken }} seconds</p>
        <p><strong>Area for improvement:</strong> {{ weakest_category }}</p>

        {% if error %}
            <p class="text-danger">{{ error }}</p>
        {% endif %}

        <form method="post" class="mt-3">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Enter your name for the leaderboard:</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <button class="btn btn-pink w-100" type="submit">
                Submit Score
            </button>
        </form>

        <a href="/" class="btn btn-outline-secondary mt-3 w-100">Play Again</a>

        <a href="/review" class="btn btn-outline-primary mt-3 w-100">Review Missed Questions</a>
    </div>
</div>
</body>
</html>
