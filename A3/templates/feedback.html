<!DOCTYPE html>
<html>
<head>
    <title>Answer Feedback</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container d-flex justify-content-center mt-5">
    <div class="quiz-card text-center w-100" style="max-width: 600px;">

        {% if was_correct %}
            <h1 class="text-success mb-3">✅ Correct!</h1>
            <p class="fs-5">You chose the right answer.</p>
        {% else %}
            <h1 class="text-danger mb-3">❌ Incorrect</h1>
            <p class="fs-5">You chose: <strong>{{ selected_answer }}</strong></p>
            <p class="fs-5">The correct answer was: <strong>{{ correct_answer }}</strong></p>
        {% endif %}

        <p class="mt-3"><strong>Explanation:</strong> {{ explanation }}</p>

        <form method="post">
            <button class="btn btn-pink mt-4 w-100" type="submit">
                Next Question
            </button>
        </form>

    </div>
</div>
</body>
</html>
