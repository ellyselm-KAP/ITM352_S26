<!DOCTYPE html>
<html>
<head>
    <title>Quiz Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container d-flex justify-content-center mt-5">
    <div class="quiz-card text-center w-100" style="max-width: 600px;">

        <h3 class="mb-3">Question {{ question_number }} of {{ total_questions }}</h3>

        <div class="progress mb-4" style="height: 25px;">
            <div 
                class="progress-bar bg-success" 
                role="progressbar" 
                style="width: {{ (question_number / total_questions) * 100 }}%;"
                aria-valuenow="{{ question_number }}"
                aria-valuemin="0"
                aria-valuemax="{{ total_questions }}">
                {{ question_number }} / {{ total_questions }}
            </div>
        </div>

        <p class="fs-4 mb-4">{{ question.question }}</p>

        <form method="post">
            {% for option in question.options %}
                <div class="form-check text-start mb-3">
                    <input class="form-check-input" type="radio" name="answer" value="{{ option }}" id="option{{ loop.index }}" required>
                    <label class="form-check-label fs-5" for="option{{ loop.index }}">
                        {{ option }}
                    </label>
                </div>
            {% endfor %}

            <button class="btn btn-pink mt-3 w-100" type="submit">
                Submit Answer
            </button>
        </form>

    </div>
</div>
</body>
</html>
